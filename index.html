<!doctype html>
<html lang="en">
    <head>
        <title>Travlog</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- SEO Meta Tags -->
        <meta
            name="description"
            content="Travlog - Find Your Dream Destination & Travel The World"
        />
        <meta
            name="keywords"
            content="travel, blog, experiences, adventures, stories"
        />
        <meta name="author" content="Jatin Kaushik" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Travlog" />
        <meta
            property="og:description"
            content="Travlog - Find Your Dream Destination & Travel The World"
        />
        <meta property="og:image" content="/logo.svg" />
        <meta property="og:image:alt" content="Travlog Logo" />
        <meta property="og:image:type" content="image/svg+xml" />
        <meta property="og:site_name" content="Travlog" />
        <!-- <meta property="og:url" content="https://travlog.com" /> -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Travlog" />
        <meta
            name="twitter:description"
            content="Travlog - Find Your Dream Destination & Travel The World"
        />
        <meta name="twitter:image" content="/logo.svg" />
        <meta name="twitter:image:alt" content="Travlog Logo" />
        <!-- favicon   -->
        <link rel="icon" type="image/svg+xml" href="/logo.svg" />
        <link
            rel="alternate icon"
            type="image/x-icon"
            href="/favicon.ico"
            sizes="48x48"
        />
        <link
            rel="apple-touch-icon"
            href="/apple-touch-icon.png"
            sizes="180x180"
        />
        <link
            rel="preload"
            as="image"
            href="/assets/images/travel.png"
            fetchpriority="high"
        />
        <link rel="stylesheet" href="src/styles/main.scss" />
        <link
            href="/assets/icons/travlog-icons.woff2"
            as="font"
            rel="preload"
            type="font/woff2"
            crossorigin="anonymous"
        />
    </head>
    <body>
        <header>
            <div class="container header__wrapper">
                <nav class="navbar">
                    <div class="navbar__logo">
                        <a href="#" aria-label="Travlog Home">
                            <img src="/logo.svg" alt="Travlog Logo" />
                        </a>
                    </div>
                    <div class="navbar__links">
                        <div class="navbar__hamburger">
                            <button
                                class="icon icon-menu"
                                aria-label="Open menu"
                            ></button>
                            <button
                                class="icon icon-menu-close icon-menu-close--hidden"
                                aria-label="Close menu"
                            ></button>
                        </div>
                        <div class="navbar__menu">
                            <a href="#" class="navbar__link">Home</a>
                            <a href="#" class="navbar__link">Discover</a>
                            <a href="#" class="navbar__link">Special Deals</a>
                            <a href="#" class="navbar__link">Contact</a>
                        </div>
                    </div>
                </nav>
            </div>
        </header>
        <main>
            <section id="hero-section">
                <div class="container hero__wrapper">
                    <div class="hero">
                        <div class="hero__text-content">
                            <div class="badge">
                                Explore the world!
                                <span class="icon icon-work"></span>
                            </div>
                            <h1 class="heading-1 hero__headline">
                                Travel
                                <span class="hero__highlight"
                                    >top destination</span
                                >
                                of the world
                            </h1>
                            <p class="hero__sub-headline">
                                We always make our customer happy by providing
                                as many choices as possible
                            </p>
                            <div class="hero__cta">
                                <button class="btn-primary hero__cta-button">
                                    Get Started
                                </button>
                                <button class="btn-outline hero__cta-button">
                                    <span class="icon icon-play-circle"></span>
                                    Watch Demo
                                </button>
                            </div>
                        </div>
                        <div class="hero__media-content">
                            <div class="hero__collage">
                                <div>
                                    <img
                                        src="/assets/images/travel-location-img01.webp"
                                        alt="travel location one"
                                        fetchpriority="high"
                                    />
                                    <div
                                        class="badge-icon hero__badge hero__badge-send"
                                    >
                                        <span class="icon icon-send"></span>
                                    </div>
                                </div>
                                <div>
                                    <img
                                        src="/assets/images/travel-location-img02.webp"
                                        alt="travel location two"
                                        fetchpriority="high"
                                    />
                                </div>
                                <div>
                                    <img
                                        src="/assets/images/travel-location-img03.webp"
                                        alt="travel location three"
                                        fetchpriority="high"
                                    />
                                    <div class="badge-sm badge-top-place">
                                        <span class="icon icon-location"></span>
                                        Top Places
                                    </div>
                                </div>
                                <div
                                    class="badge-icon hero__badge hero__badge-user"
                                >
                                    <span class="icon icon-add-user"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="triangle-pattern"></div>
            </section>
            <section>
                <div class="container">
                    <div class="partner-ribbon">
                        <div class="partner-ribbon__partner-logo">
                            <img
                                src="/assets/images/partner-logos/logo-tripadvisor.png"
                                alt="tripadvisor-logo"
                            />
                        </div>
                        <div class="partner-ribbon__partner-logo">
                            <img
                                src="/assets/images/partner-logos/logo-expedia.png"
                                alt="expedia-logo"
                            />
                        </div>
                        <div class="partner-ribbon__partner-logo">
                            <img
                                src="/assets/images/partner-logos/logo-bookingdotcom.png"
                                alt="booking.com-logo"
                            />
                        </div>
                        <div class="partner-ribbon__partner-logo">
                            <img
                                src="/assets/images/partner-logos/logo-airbnb.png"
                                alt="airbnb-logo"
                            />
                        </div>
                        <div class="partner-ribbon__partner-logo">
                            <img
                                src="/assets/images/partner-logos/logo-orbitz.png"
                                alt="orbitz-logo"
                            />
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer></footer>
        <div class="circular-bg"></div>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
