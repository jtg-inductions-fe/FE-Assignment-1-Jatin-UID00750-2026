<!doctype html>
<html lang="en">
    <head>
        <title>Travlog</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- SEO Meta Tags -->
        <meta
            name="description"
            content="Travlog - Find Your Dream Destination & Travel The World"
        />
        <meta
            name="keywords"
            content="travel, blog, experiences, adventures, stories"
        />
        <meta name="author" content="Jatin Kaushik" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Travlog" />
        <meta
            property="og:description"
            content="Travlog - Find Your Dream Destination & Travel The World"
        />
        <meta property="og:image" content="/logo.svg" />
        <meta property="og:image:alt" content="Travlog Logo" />
        <meta property="og:image:type" content="image/svg+xml" />
        <meta property="og:site_name" content="Travlog" />
        <!-- <meta property="og:url" content="https://travlog.com" /> -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Travlog" />
        <meta
            name="twitter:description"
            content="Travlog - Find Your Dream Destination & Travel The World"
        />
        <meta name="twitter:image" content="/logo.svg" />
        <meta name="twitter:image:alt" content="Travlog Logo" />
        <!-- favicon   -->
        <link rel="icon" type="image/svg+xml" href="/logo.svg" />
        <link
            rel="alternate icon"
            type="image/x-icon"
            href="/favicon.ico"
            sizes="48x48"
        />
        <link
            rel="apple-touch-icon"
            href="/apple-touch-icon.png"
            sizes="180x180"
        />

        <link rel="stylesheet" href="src/styles/main.scss" />
        <link
            href="/assets/icons/travlog-icons.woff2"
            as="font"
            rel="preload"
            type="font/woff2"
            crossorigin="anonymous"
        />
    </head>
    <body>
        <header></header>
        <main></main>
        <footer></footer>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
