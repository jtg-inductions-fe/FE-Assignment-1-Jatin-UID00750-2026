<!doctype html>
<html lang="en">
    <head>
        <title>Travlog</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- SEO Meta Tags -->
        <meta
            name="description"
            content="Travlog - Find Your Dream Destination & Travel The World"
        />
        <meta
            name="keywords"
            content="travel, blog, experiences, adventures, stories"
        />
        <meta name="author" content="Jatin Kaushik" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Travlog" />
        <meta
            property="og:description"
            content="Travlog - Find Your Dream Destination & Travel The World"
        />
        <meta property="og:image" content="/assets/logo.png" />
        <meta property="og:image:alt" content="Travlog Logo" />
        <meta property="og:image:type" content="image/svg+xml" />
        <meta property="og:site_name" content="Travlog" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Travlog" />
        <meta
            name="twitter:description"
            content="Travlog - Find Your Dream Destination & Travel The World"
        />
        <meta name="twitter:image" content="/assets/logo.png" />
        <meta name="twitter:image:alt" content="Travlog Logo" />
        <!-- favicon   -->
        <link
            rel="icon"
            type="image/x-icon"
            href="/favicon.ico"
            sizes="48x48"
        />
        <link rel="apple-touch-icon" href="/assets/logo.png" sizes="180x180" />

        <link rel="stylesheet" href="src/styles/main.scss" />
    </head>
    <body>
        <header>
            <nav class="container navbar">
                <div class="navbar__logo">
                    <a href="#" aria-label="Travlog Home">
                        <img src="/assets/logo.png" alt="Travlog Logo" />
                    </a>
                </div>
                <div class="navbar__links">
                    <div class="navbar__hamburger">
                        <button
                            class="icon icon-menu navbar__icon"
                            aria-label="Open menu"
                        ></button>
                        <button
                            class="icon icon-menu-close navbar__icon navbar__icon--hidden"
                            aria-label="Close menu"
                        ></button>
                    </div>
                    <ul class="navbar__menu">
                        <li><a href="#" class="navbar__link">Home</a></li>
                        <li>
                            <a href="#" class="navbar__link">Discover</a>
                        </li>
                        <li>
                            <a href="#" class="navbar__link">Special Deals</a>
                        </li>
                        <li>
                            <a href="#" class="navbar__link">Contact</a>
                        </li>
                    </ul>
                </div>
                <div class="ellipse"></div>
            </nav>
        </header>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
