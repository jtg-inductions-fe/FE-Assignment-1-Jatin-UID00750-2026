<!doctype html>
<html lang="en">
    <head>
        <title>Travlog</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- SEO Meta Tags -->
        <meta
            name="description"
            content="Travlog - Find Your Dream Destination & Travel The World"
        />
        <meta
            name="keywords"
            content="travel, blog, experiences, adventures, stories"
        />
        <meta name="author" content="Jatin Kaushik" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Travlog" />
        <meta
            property="og:description"
            content="Travlog - Find Your Dream Destination & Travel The World"
        />
        <meta property="og:image" content="/assets/logo.png" />
        <meta property="og:image:alt" content="Travlog Logo" />
        <meta property="og:image:type" content="image/svg+xml" />
        <meta property="og:site_name" content="Travlog" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Travlog" />
        <meta
            name="twitter:description"
            content="Travlog - Find Your Dream Destination & Travel The World"
        />
        <meta name="twitter:image" content="/assets/logo.png" />
        <meta name="twitter:image:alt" content="Travlog Logo" />
        <!-- favicon   -->
        <link
            rel="icon"
            type="image/x-icon"
            href="/favicon.ico"
            sizes="48x48"
        />
        <link rel="apple-touch-icon" href="/assets/logo.png" sizes="180x180" />

        <link rel="stylesheet" href="src/styles/main.scss" />
    </head>
    <body>
        <!-- Header Section -->
        <header class="header">
            <div class="container">
                <nav class="header__nav">
                    <a href="#" aria-label="Travlog Home" class="header__logo">
                        <img src="/assets/logo.png" alt="Travlog Logo" />
                    </a>
                    <button
                        class="icon icon-menu header__hamburger-icon"
                        aria-label="Menu icon"
                    ></button>
                    <div class="header__menu">
                        <ul class="header__links">
                            <li>
                                <a href="#" class="header__link">Home</a>
                            </li>
                            <li>
                                <a href="#" class="header__link">Discover</a>
                            </li>
                            <li>
                                <a href="#" class="header__link"
                                    >Special Deals</a
                                >
                            </li>
                            <li>
                                <a href="#" class="header__link">Contact</a>
                            </li>
                        </ul>
                        <ul class="header__buttons">
                            <li>
                                <a
                                    href="#"
                                    class="btn btn--ghost header__button"
                                    aria-label="login button"
                                >
                                    Login
                                </a>
                            </li>
                            <li>
                                <a
                                    href="#"
                                    class="btn header__button"
                                    aria-label="sign up button"
                                >
                                    Sign Up
                                </a>
                            </li>
                        </ul>
                    </div>
                </nav>
            </div>
        </header>
        <div class="ellipse"></div>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
